[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topolino"
version = "0.1.3"
description = "Fourier optics and wave propagation utilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Rachel Migdal", email = "rmigdal2007@gmail.com" },
]
keywords = ["fourier optics", "wave propagation", "physics", "optics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scikit-image",
]

[project.urls]
Repository = "https://github.com/rmig27/projectTopolino"

[tool.setuptools.packages.find]
where = ["."]
include = ["topolino*"]

[project.optional-dependencies]
dev = ["jupyter", "matplotlib"]
